<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/main.js"></script>
    <title>Página de Padel</title>
</head>
<body>
    <h1>Turnero de Canchas de Padel</h1>
    <p id="jugador-activo"></p>
    <form id="form-jugador">
        <label for="input-nombre">Nombre del jugador:</label>
        <input id="input-nombre" type="text" required>
        <button type="submit">Ingresar</button>
    </form>

    <label for="dia-elegido">Elegí un día:</label>
    <select id="dia-elegido">
        <option value="Lunes">Lunes</option>
        <option value="Martes">Martes</option>
        <option value="Miércoles">Miércoles</option>
        <option value="Jueves">Jueves</option>
        <option value="Viernes">Viernes</option>
    </select>

    <p id="mensaje"></p>
    <section id="turnos-disponibles"></section>
    

</body>
</html>
